\* TLA+ model configuration for provisioner verification
SPECIFICATION Spec

\* Constants - keep small for model checking
CONSTANTS
    MaxMachines = 3
    MaxRetries = 2
    MaxWorkers = 2

\* Invariants to check
INVARIANT
    TypeInvariant
    NoSimultaneousStartStop
    StartingImpliesIsStarting
    StoppingImpliesIsStopping
    DeadMachinesAreIdle
    RetryCountBounded
    WorkerCountValid
    ValidStateTransitions

\* Properties to verify
PROPERTY
    PendingMachinesEventuallyProcessed
    FailedMachinesEventuallyRetry

\* Symmetry to reduce state space
SYMMETRY Permutations({1, 2, 3})

\* View to reduce state space by abstracting timestamps
VIEW <<machines, eventQueues, workers>>
